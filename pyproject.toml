[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "croupier"
version = "0.1.0"
description = "Policy engine and audit trail for agentic multi-strategy trading"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.12"
dependencies = [
    # Bounded pins: floors are the versions this repo is developed and CI-tested
    # against; major/minor caps keep `pip install -e .` reproducible over time.
    "pyyaml>=6.0,<7",
    "httpx>=0.28,<0.29",   # required by croupier.data.stooq / croupier.data.schwab
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.5,<1",
]

[project.scripts]
croupier = "croupier.cli:main"

[tool.setuptools.packages.find]
include = ["croupier*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
